server:
  port: ${MCP_SERVER_PORT:8082}

spring:
  application:
    name: iiot-mcp-server
  ai:
    mcp:
      server:
        name: push-log-readonly-tools
        version: 0.2.0
        type: SYNC
        protocol: STREAMABLE
        instructions: 只提供 push_log 告警统计和原有设备只读查询能力；push_log 的 channel 代表车间或工序。

iiot:
  api:
    base-url: ${IIOT_API_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:log4j2-spring.xml
